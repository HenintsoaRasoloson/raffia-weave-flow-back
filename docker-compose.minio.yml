services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: raffia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: amazon/aws-cli:2.31.12
    container_name: raffia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-ged-raw}
      MINIO_BUCKET_RENDERED: ${MINIO_BUCKET_RENDERED:-ged-rendered}
      MINIO_BUCKET_ARCHIVE: ${MINIO_BUCKET_ARCHIVE:-ged-archive}
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url http://minio:9000 s3 mb s3://$$MINIO_BUCKET_RAW || true
        aws --endpoint-url http://minio:9000 s3 mb s3://$$MINIO_BUCKET_RENDERED || true
        aws --endpoint-url http://minio:9000 s3 mb s3://$$MINIO_BUCKET_ARCHIVE || true
        echo 'MinIO buckets initialized successfully.'
    restart: 'no'

volumes:
  minio-data:
